# Builds the SvZ Enhanced 120 Hz probe: a small Android app that runs the game's frame-pacing code
# (godot/src/Engine/Core/FramePacing*.cs) without any game files, so 120 Hz support can be checked on a
# phone before the game itself is built. Contains no Glu/game content.
# Output: pre-release "probe-latest" of this repository (replaced on every build of an enhanced/** branch),
# plus a 7-day workflow artifact. The probe contains NO game files: it is built only from tools/probe and
# godot/src/Engine/Core/FramePacing*.cs (tests/tools/test_workflows.py enforces this). Signed with a throwaway
# key made in each run: uninstall the probe before installing a newer one.
name: Probe APK

on:
  push:
    branches: ["enhanced/**"]
    paths: ["tools/probe/**", "godot/src/Engine/Core/FramePacing*.cs", "tools/verify/**", ".github/workflows/probe-apk.yml"]
  pull_request:
    paths: ["tools/probe/**", "godot/src/Engine/Core/FramePacing*.cs", "tools/verify/**", ".github/workflows/probe-apk.yml"]
  workflow_dispatch:

permissions:
  contents: read   # only the publish job below may write, for the probe-latest release

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "9.0.x"

      - name: Godot 4.7.2 .NET editor and export templates (official builds)
        run: |
          base=https://github.com/godotengine/godot/releases/download/4.7.2-stable
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v4.7.2-stable_mono_linux_x86_64.zip"
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v4.7.2-stable_mono_export_templates.tpz"
          unzip -q /tmp/godot.zip -d /tmp/godot
          t="$HOME/.local/share/godot/export_templates/4.7.2.stable.mono"
          mkdir -p "$t" /tmp/tpl
          unzip -q /tmp/templates.tpz 'templates/android_*' 'templates/version.txt' -d /tmp/tpl
          mv /tmp/tpl/templates/* "$t/"
          rm -f /tmp/templates.tpz
          echo "GODOT=$(ls /tmp/godot/*/Godot_v4.7.2-stable_mono_linux.x86_64)" >> "$GITHUB_ENV"

      - name: Editor settings and a throwaway signing key
        run: |
          java_home="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          ks="$RUNNER_TEMP/probe.jks"
          pw=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')
          echo "::add-mask::$pw"
          "$java_home/bin/keytool" -genkeypair -keystore "$ks" -storepass "$pw" -keypass "$pw" -alias probe \
            -dname "CN=SvZ probe (throwaway)" -keyalg RSA -keysize 2048 -validity 3650 >/dev/null
          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$java_home\""
          } > "$HOME/.config/godot/editor_settings-4.7.tres"
          { echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$ks"; echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=probe"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$pw"; } >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platform-tools" | head

      - name: Export arm64 APK
        working-directory: tools/probe
        run: |
          mkdir -p ../../build
          "$GODOT" --headless --path . --import > /dev/null 2>&1 || true
          "$GODOT" --headless --path . --export-release Android ../../build/svz-probe.apk 2>&1 | tee ../../build/export.log | grep -E "ERROR|WARNING|DONE" || true
          test -f ../../build/svz-probe.apk || { tail -80 ../../build/export.log; exit 1; }
          ls -l ../../build/svz-probe.apk

      - name: Verify APK
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"   # not pip --user: python -I ignores user site-packages
          "$RUNNER_TEMP/venv/bin/pip" install --quiet androguard==4.1.4
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$RUNNER_TEMP/venv/bin/python" -I tools/verify/verify_apk.py build/svz-probe.apk --require-abi arm64-v8a \
            --expect-package io.github.danttedaa.svzprobe --forbid-permission android.permission.INTERNET \
            --check-bridge --apksigner "$apksigner" --json build/verify.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: svz-probe-apk
          path: |
            build/svz-probe.apk
            build/verify.json
          retention-days: 7

  publish:
    # only for pushes to this repository's enhanced/** branches (never for pull requests from forks)
    needs: probe
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: svz-probe-apk
          path: probe
      - name: Replace the probe-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f probe/svz-probe.apk
          gh release delete probe-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          printf '%s\n' "SvZ Enhanced 120 Hz probe built from \`${GITHUB_SHA:0:12}\` (${GITHUB_REF_NAME})." "" \
            "A test app for the frame-pacing code. Contains no game files. Uninstall an older probe first (each build has its own throwaway key)." > notes.md
          gh release create probe-latest --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "120 Hz probe (no game files)" --notes-file notes.md probe/svz-probe.apk probe/verify.json

