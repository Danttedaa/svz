# Builds SvZ for Android, Windows, Linux and macOS.
#
# SvZ Enhanced: the APKs and archives built here contain the original game, so this workflow
# refuses to run in a public repository and never publishes releases. Artifacts are kept for 3 days
# and are visible only to people with access to the private repository it runs in.
#
# Needs repository secrets (Settings > Secrets and variables > Actions):
#   SVZ_APK_URL       link to your original Samurai vs Zombies Defense 3.4.0 APK (a direct link, or a
#                     Google Drive share link of a file shared with "anyone with the link")
#   SVZ_KEYSTORE_B64  base64 of keys/svz.jks (optional; without it a new key is made and phones
#                     cannot update an install that was signed with your key)
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read             # no releases: nothing is published from this workflow

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Refuse to run in a public repository
        if: ${{ github.event.repository.private != true }}
        run: |
          echo "::error::This build embeds the original game; it only runs in private repositories."
          exit 1

      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Fetch the original APK
        env:
          SVZ_APK_URL: ${{ secrets.SVZ_APK_URL }}
        run: |
          if [ -z "$SVZ_APK_URL" ]; then
            echo "::error::Set the SVZ_APK_URL secret to a direct download link of the original APK"
            exit 1
          fi
          url="$SVZ_APK_URL"
          # Google Drive share links -> direct download (confirm=t skips the large-file warning page)
          id=$(printf '%s' "$url" | sed -nE 's#.*drive\.google\.com/(file/d/|open\?id=|uc\?(export=download&)?id=)([A-Za-z0-9_-]+).*#\3#p')
          if [ -n "$id" ]; then url="https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t"; fi
          echo "::add-mask::$url"   # the derived link is not a secret itself, so mask it explicitly
          mkdir -p original
          curl -fsSL --retry 3 -o original/svz.apk "$url"
          unzip -tq original/svz.apk > /dev/null || { echo "::error::SVZ_APK_URL did not return a valid APK (is it a direct download link?)"; exit 1; }
          ls -lh original/svz.apk

      - name: Signing key
        env:
          SVZ_KEYSTORE_B64: ${{ secrets.SVZ_KEYSTORE_B64 }}
        run: |
          mkdir -p keys
          if [ -n "$SVZ_KEYSTORE_B64" ]; then echo "$SVZ_KEYSTORE_B64" | base64 -d > keys/svz.jks; fi

      - name: Build all platforms
        run: nix develop -c tools/build.sh --platform all

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: svz-android-arm64
          path: build/svz.apk
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: svz-windows-x86_64
          path: build/svz-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: svz-linux-x86_64
          path: build/svz-linux-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: svz-linux-arm64
          path: build/svz-linux-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: svz-macos
          path: build/svz-macos.zip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          retention-days: 3
          name: export-logs
          path: build/*.log
