# Optional: ask the private build repository to rebuild the APK right after a push here.
# Sends only the branch name; no game files are involved in this public repository.
#
# Enable by adding, in THIS repository's Settings > Secrets and variables > Actions:
#   variable SVZ_PRIVATE_BUILD_REPO   e.g. Danttedaa/svz-private
#   secret   SVZ_PRIVATE_BUILD_TOKEN  fine-grained token limited to that one repository,
#                                     permission "Contents: Read and write" (needed for repository_dispatch)
# Without them this workflow does nothing; the private repository still checks for new commits daily.
# Secrets are not given to workflows triggered by pull requests from other forks.
name: Notify private build

on:
  push:
    branches: [main, "enhanced/**"]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: repository_dispatch engine-updated
        env:
          TOKEN: ${{ secrets.SVZ_PRIVATE_BUILD_TOKEN }}
          TARGET: ${{ vars.SVZ_PRIVATE_BUILD_REPO }}
          REF: ${{ github.ref_name }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$TARGET" ]; then echo "private build notifier not configured; skipping"; exit 0; fi
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$TARGET/dispatches" \
            -d "{\"event_type\":\"engine-updated\",\"client_payload\":{\"ref\":\"$REF\"}}"
          echo "asked $TARGET to build $REF"
